name: Publier l'image et deployer

# À chaque livraison sur main : compile le frontend, fabrique l'image
# Docker, la publie sur GHCR, incrémente la version dans
# addon/trano/config.yaml, la recommite, puis **déploie sur le serveur
# de la maison**.
#
# Le numéro de version ne sert plus qu'à **taguer l'image** : la piste
# add-on Home Assistant est abandonnée (cf. deploy/README.md), plus
# personne ne surveille ce numéro pour installer une mise à jour.
#
# Secrets requis pour l'étape de déploiement (repo → Settings → Secrets
# and variables → Actions) — les mêmes que le workflow deploy-engine du
# dépôt Oby, qui déploie sur la même machine :
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET — client OAuth Tailscale (scope
#     auth_keys, tag:ci). Sans tailnet, l'IP du serveur est injoignable
#     depuis un runner GitHub.
#   TRANO_DEPLOY_SSH_KEY — clé privée ed25519 **dédiée à Trano** (sa .pub est
#     dans les authorized_keys du serveur sous le commentaire
#     `github-actions-deploy-trano`). Volontairement distincte de celle d'Oby :
#     on peut couper le déploiement de Trano sans toucher au sien.
# Tant qu'ils manquent, l'étape se saute proprement en disant quoi taper
# à la main : une CI qui échoue à chaque livraison serait pire que rien.
on:
  push:
    branches: [main]
  workflow_dispatch: # relance manuelle depuis l'onglet Actions

# Le commit de version porte le marqueur d'exclusion reconnu par GitHub
# Actions (voir l'étape finale) : sans lui, ce commit relancerait la CI,
# qui recommiterait, à l'infini.
#
# ⚠️ Ce marqueur est cherché dans TOUT le message de commit, corps inclus.
# Ne jamais l'écrire littéralement dans un message de commit ordinaire :
# la livraison serait ignorée en silence, sans la moindre trace d'erreur.

permissions:
  contents: write # recommit de la version
  packages: write # publication sur GHCR

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler le frontend (natif x86 — rapide)
        run: npm run build

      - name: Calculer la nouvelle version
        id: version
        run: |
          CONFIG=addon/trano/config.yaml
          CURRENT=$(sed -n 's/^version: "\(.*\)"/\1/p' "$CONFIG")
          MAJ=${CURRENT%%.*}; REST=${CURRENT#*.}; MIN=${REST%%.*}; PATCH=${REST#*.}
          NEW="$MAJ.$MIN.$((PATCH + 1))"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Version publiée : $CURRENT → $NEW"

      # QEMU permet de fabriquer l'image arm64 (la Freebox) depuis un
      # runner x86. Aucune compilation native dans l'image, donc l'émulation
      # ne coûte que le temps d'installation des dépendances.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fabriquer et publier l'image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/walson-a/trano:${{ steps.version.outputs.new }}
            ghcr.io/walson-a/trano:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Après la publication seulement : si l'image n'est pas partie, la
      # version n'avance pas et Home Assistant ne tentera pas d'installer
      # un tag inexistant.
      - name: Publier la nouvelle version pour Home Assistant
        run: |
          sed -i 's/^version: ".*"/version: "${{ steps.version.outputs.new }}"/' addon/trano/config.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addon/trano/config.yaml
          git commit -m "release: Trano v${{ steps.version.outputs.new }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  # Le serveur tourne sur l'image `:latest`, mais rien ne la tire tout seul :
  # ni watchtower, ni timer, ni cron (vérifié le 2026-08-08). Sans ce job, une
  # livraison publie une image que personne n'installe — et on croit avoir
  # déployé.
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier que les secrets sont là
        id: secrets
        env:
          TS_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          SSH_KEY: ${{ secrets.TRANO_DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$TS_ID" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::Secrets de déploiement absents — image publiée, serveur NON mis à jour."
            echo "Pour déployer à la main : cd ~/trano && docker compose pull && docker compose up -d"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rejoindre le tailnet
        if: steps.secrets.outputs.present == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Préparer la clé SSH
        if: steps.secrets.outputs.present == 'true'
        env:
          # La clé passe par l'environnement plutôt que d'être interpolée dans
          # le script : elle n'apparaît alors jamais dans la ligne de commande.
          SSH_KEY: ${{ secrets.TRANO_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 15 100.80.77.107 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tirer la nouvelle image et redémarrer
        if: steps.secrets.outputs.present == 'true'
        run: |
          ssh -o ConnectTimeout=15 trano@100.80.77.107 'cd ~/trano && docker compose pull && docker compose up -d && sleep 5 && curl -sf -m 5 http://127.0.0.1:3001/api/health'
